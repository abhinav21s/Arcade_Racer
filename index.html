<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" type="image/x-icon" />
  <title>Neon Arcade Racer</title>
  <meta name="description"
    content="A blazing fast OutRun-style neon arcade racer. Drift, boost, and survive the endless neon highway." />
  <meta name="theme-color" content="#0d0015" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }

    #phaser-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #phaser-container canvas {
      margin: auto !important;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="phaser-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
